<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Filtre de lueur néon intense (effet néon / hologramme) -->
    <filter id="intense-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur2" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur3" />
      <feMerge>
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Filtre de lueur douce -->
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Halos de fond et dégradés d'énergie -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#0066ff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="30%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#0055ff" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0.3" />
    </radialGradient>
  </defs>

  <!-- Fond sombres avec halo bleu ambiant -->
  <rect width="512" height="512" fill="#020617"/>
  <circle cx="256" cy="256" r="256" fill="url(#bgGlow)"/>

  <!-- Groupe central HUD -->
  <g transform="translate(256, 256)">

    <!-- 1. Repères fixes d'interface (Réticule) -->
    <g opacity="0.35">
      <circle r="235" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="1 5"/>
      <path d="M 0 -245 L 0 -225 M 0 225 L 0 245 M -245 0 L -225 0 M 225 0 L 245 0" stroke="#00f0ff" stroke-width="2"/>
      <path d="M -160 -160 L -150 -150 M 150 150 L 160 160 M 160 -160 L 150 -150 M -150 150 L -160 160" stroke="#00f0ff" stroke-width="1.5"/>
    </g>

    <!-- 2. Grand anneau extérieur Cyan - Rotation horaire (30s) -->
    <g filter="url(#intense-glow)">
      <circle r="210" fill="none" stroke="#00f0ff" stroke-width="3" stroke-dasharray="160 25 10 25 40 25" opacity="0.95">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Anneau de données précis - Rotation anti-horaire (20s) -->
    <g opacity="0.7">
      <circle r="192" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 8 16 8">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- 3. Anneau bleu électrique + touche de violet très subtile - Rotation horaire (16s) -->
    <g filter="url(#intense-glow)">
      <circle r="165" fill="none" stroke="#0088ff" stroke-width="4" stroke-dasharray="80 20 30 20">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
      </circle>
      <!-- Subtile touche violette en filigrane -->
      <circle r="150" fill="none" stroke="#a855f7" stroke-width="1" stroke-dasharray="2 16" opacity="0.4">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="24s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- 4. Anneau interne ultra-lumineux (Blanc / Cyan) - Rotation anti-horaire (10s) -->
    <g filter="url(#intense-glow)">
      <circle r="125" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="50 15 5 15 20 15" opacity="0.95">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="10s" repeatCount="indefinite"/>
      </circle>
      <circle r="110" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="3 6" opacity="0.6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- 5. Géométrie technologique centrale (Triangles entrelacés) - Rotation rapide (12s) -->
    <g opacity="0.85" filter="url(#soft-glow)">
      <polygon points="0,-85 73.61,42.5 -73.61,42.5" fill="none" stroke="#00f0ff" stroke-width="1.5">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="0,85 73.61,-42.5 -73.61,-42.5" fill="none" stroke="#0088ff" stroke-width="1" opacity="0.7">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/>
      </polygon>
    </g>

    <!-- 6. Noyau d'énergie central (Arc Reactor) -->
    <g filter="url(#intense-glow)">
      <!-- Fond du noyau incandescent -->
      <circle r="60" fill="url(#coreGlow)"/>
      
      <!-- Cœur hyper-lumineux -->
      <circle r="22" fill="#ffffff" opacity="0.95"/>
      <circle r="10" fill="#00f0ff"/>
    </g>

    <!-- Pulsation lumineuse du cœur (Effet de respiration/battement d'énergie) -->
    <circle r="65" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.8" filter="url(#soft-glow)">
      <animate attributeName="r" values="60;72;60" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.5s" repeatCount="indefinite"/>
    </circle>

  </g>
</svg>
