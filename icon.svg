<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Filtre de lueur cyan -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Filtre de lueur violette -->
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Dégradé pour le noyau central -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#bd00ff" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" fill="#020617"/>

  <!-- Groupe central -->
  <g transform="translate(256, 256)">
    
    <!-- Réticule de visée externe -->
    <circle r="230" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.2"/>
    <path d="M 0 -240 L 0 -220 M 0 220 L 0 240 M -240 0 L -220 0 M 220 0 L 240 0" stroke="#00f0ff" stroke-width="2" opacity="0.6"/>

    <!-- Anneau principal Cyan (Pointillés complexes + Lueur) -->
    <circle r="200" fill="none" stroke="#00f0ff" stroke-width="4" stroke-dasharray="2 6 40 8" opacity="0.9" filter="url(#glow-cyan)"/>
    
    <!-- Anneaux de données fins -->
    <circle r="190" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
    <circle r="175" fill="none" stroke="#bd00ff" stroke-width="1" stroke-dasharray="20 5 2 5" opacity="0.6" transform="rotate(45)"/>

    <!-- Anneau principal Violet -->
    <circle r="130" fill="none" stroke="#bd00ff" stroke-width="6" stroke-dasharray="120 30" opacity="0.8" filter="url(#glow-purple)"/>
    <circle r="122" fill="none" stroke="#bd00ff" stroke-width="1" stroke-dasharray="1 8" opacity="0.5"/>

    <!-- Anneaux internes de précision -->
    <circle r="90" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="10 10" opacity="0.4"/>
    <circle r="80" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="50 15 5 15" opacity="0.7"/>

    <!-- Noyau d'énergie central -->
    <circle r="60" fill="url(#coreGrad)" filter="url(#glow-cyan)"/>
    
    <!-- Profondeur et géométrie au centre du noyau -->
    <circle r="45" fill="#020617" opacity="0.4"/>
    <polygon points="0,-20 17.32,10 -17.32,10" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.9"/>
    <circle r="8" fill="#00f0ff" opacity="0.8"/>
  </g>
</svg>
