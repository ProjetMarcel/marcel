<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MARCEL</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">
    <meta name="theme-color" content="#020617">
</head>
<body>
    <canvas id="bg"></canvas>
    <div class="scan"></div>

    <header>
        <div class="hud-title">
            <span class="system-status">SYS.ONLINE</span>
            <h1>MARCEL // HUD v4.0</h1>
        </div>
        <div class="status-indicator" onclick="configurerCleAPI()" title="Changer la clé API">
            <i class="dot"></i><span>CORE LINK</span>
        </div>
    </header>

    <div class="hud-banner">
        <div class="ring-wrap">
            <svg viewBox="0 0 80 80"><circle class="r0" cx="40" cy="40" r="34"/><circle id="ring" class="r1" cx="40" cy="40" r="34"/></svg>
            <b id="pct">0%</b><i class="spin s1"></i><i class="spin s2"></i>
        </div>
        <div class="telemetry">
            <span id="t-day">JOUR 1/180</span>
            <span id="t-streak">SÉRIE 0 JOUR</span>
            <span>OBJECTIF 5000€/MOIS</span>
        </div>
    </div>

    <nav>
        <button class="on" data-v="chat">CHAT</button>
        <button data-v="plan">PLAN 6 MOIS</button>
        <button data-v="hist">HISTORIQUE</button>
        <i id="ind"></i>
    </nav>

    <main>
        <section id="v-chat" class="view on">
            <div id="chat-container"></div>
            <div class="quick-actions">
                <button class="quick-btn" onclick="envoyerPromptPredefini('Fais-moi un point stratégique pour atteindre les 5000€/mois.')">STRATÉGIE 5K</button>
                <button class="quick-btn" onclick="envoyerPromptPredefini('Optimise ma fiche GBP et mes citations locales.')">AUDIT GBP</button>
                <button class="quick-btn" onclick="envoyerPromptPredefini('Donne-moi une automatisation Python à lancer.')">SCRIPTS AUTO</button>
                <button class="quick-btn" onclick="envoyerPromptPredefini('Construis mon plan détaillé des 14 prochains jours et enregistre-le avec les balises PLAN.')">PLAN 14J</button>
                <button class="quick-btn" onclick="envoyerPromptPredefini('Bilan : j\'ai terminé la tâche du jour. Valide-la et donne la suite.')">JOUR TERMINÉ</button>
            </div>
            <div class="input-area">
                <input type="text" id="userInput" placeholder="Entrer une commande pour Marcel..." onkeypress="verifierEntree(event)">
                <button class="send-btn" onclick="envoyerMessage()">EXÉCUTER</button>
            </div>
        </section>

        <section id="v-plan" class="view">
            <div class="scroll">
                <div id="detail" class="panel"></div>
                <div id="grid"></div>
                <button class="quick-btn reset" onclick="resetPlan()">RELANCER LE PLAN À AUJOURD'HUI</button>
            </div>
        </section>

        <section id="v-hist" class="view">
            <div class="tools">
                <input type="text" id="hs" placeholder="Rechercher dans l'historique..." oninput="renderHist()">
                <button class="quick-btn" onclick="exporter()">EXPORT</button>
                <button class="quick-btn" onclick="viderHist()">VIDER</button>
            </div>
            <div class="scroll" id="hl"></div>
        </section>
    </main>

    <script src="script.js?v=5"></script>
</body>
</html>
