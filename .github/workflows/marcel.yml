name: marcel
on:
  schedule:
    # 2 horaires par créneau : le script ne s'exécute que si l'heure de Paris correspond (gère l'heure d'été/hiver)
    - cron: '0 7 * * *'
    - cron: '0 8 * * *'
    - cron: '0 16 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'test | radar | briefing | bilan'
        default: 'test'
permissions:
  contents: write
concurrency:
  group: marcel
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Marcel
        run: node scripts/marcel-server.mjs "${{ github.event.inputs.mode || 'auto' }}"
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          INSEE_KEY: ${{ secrets.INSEE_KEY }}
          PLACES_KEY: ${{ secrets.PLACES_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          MY_PHONE: ${{ secrets.MY_PHONE }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Publier radar.json
        run: |
          git config user.name "marcel-bot"
          git config user.email "marcel-bot@users.noreply.github.com"
          git add radar.json || true
          git diff --cached --quiet || (git commit -m "radar du jour" && git push)
