name: marcel
on:
  schedule:
    # GitHub lance ces tâches avec du retard (parfois plusieurs heures) et en saute certaines : on multiplie les déclenchements
    # dans la fenêtre du briefing (9-12 h Paris) et du bilan (18-21 h Paris). Le script ne fait rien hors fenêtre
    # et ne renvoie jamais une alerte déjà partie. Minutes 7 et 37 : GitHub est moins chargé hors de l'heure pile.
    - cron: '7,37 7-10 * * *'
    - cron: '7,37 16-19 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'test | radar | briefing | bilan'
        default: 'test'
permissions:
  contents: write
concurrency:
  group: marcel
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier les fichiers
        run: |
          node --version
          ls -la scripts marcel.config.json
          wc -c scripts/marcel-server.mjs
      - name: Marcel
        run: node scripts/marcel-server.mjs "${{ github.event.inputs.mode || 'auto' }}"
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          INSEE_KEY: ${{ secrets.INSEE_KEY }}
          PLACES_KEY: ${{ secrets.PLACES_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          MY_PHONE: ${{ secrets.MY_PHONE }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Publier radar.json
        run: |
          git config user.name "marcel-bot"
          git config user.email "marcel-bot@users.noreply.github.com"
          if [ -f radar.json ]; then git add radar.json; fi
          git diff --cached --quiet || (git commit -m "radar du jour" && git push)
